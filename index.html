<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Student Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
        %22name%22: %22AI Student Assistant%22,
        %22short_name%22: %22AI Helper%22,
        %22start_url%22: %22./%22,
        %22display%22: %22standalone%22,
        %22background_color%22: %22%230f172a%22,
        %22theme_color%22: %22%236366f1%22,
        %22icons%22: [
            {
                %22src%22: %22https://cdn-icons-png.flaticon.com/512/4712/4712109.png%22,
                %22sizes%22: %22512x512%22,
                %22type%22: %22image/png%22
            }
        ]
    }">

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 16px 0;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header p {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .ad-placeholder {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 10px 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .action-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .action-btn:active {
            background: var(--primary-dark);
        }

        .output-card {
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 14px;
            min-height: 100px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #e2e8f0;
            white-space: pre-wrap;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1><i class="fa-solid fa-brain" style="color: #6366f1;"></i> AI Student Helper</h1>
        <p>Smart Assistant for Essays & Homework</p>
    </div>

    <div class="ad-placeholder">
        📢 Advertisement Space (AdMob Banner)
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="setMode('essay', this)">
                <i class="fa-solid fa-pen-nib"></i> Essay
            </button>
            <button class="tab-btn" onclick="setMode('grammar', this)">
                <i class="fa-solid fa-spell-check"></i> Grammar
            </button>
            <button class="tab-btn" onclick="setMode('solver', this)">
                <i class="fa-solid fa-calculator"></i> Solver
            </button>
        </div>

        <textarea id="promptInput" placeholder="Enter your essay topic or prompt here..."></textarea>

        <button class="action-btn" onclick="generateResult()">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Answer
        </button>

        <div class="output-card" id="outputArea">
            <span style="color: var(--text-dim);">Your AI output will appear here...</span>
        </div>
    </div>

    <div class="ad-placeholder">
        📢 Advertisement Space (AdMob Native)
    </div>
</div>

<script>
    const GROQ_API_KEY = "Gsk_jq0YxQ8VsKK3HUZg58wrWGdyb3FYVlXc09nRUoOBnC8hRbIx5EKe";
    let currentMode = 'essay';

    function setMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const input = document.getElementById('promptInput');
        if (mode === 'essay') input.placeholder = "Enter your essay topic or title...";
        else if (mode === 'grammar') input.placeholder = "Paste your text to correct grammar...";
        else input.placeholder = "Enter your math or homework problem...";
    }

    async function generateResult() {
        const text = document.getElementById('promptInput').value.trim();
        const output = document.getElementById('outputArea');

        if (!text) {
            alert("Please enter a question or topic!");
            return;
        }

        output.innerHTML = `<span style="color: #6366f1;">⏳ AI is processing... Please wait...</span>`;

        try {
            let systemPrompt = "You are a helpful student assistant. Always respond in English.";
            if (currentMode === 'essay') systemPrompt = "Write a clear, well-structured essay based on the topic in English.";
            else if (currentMode === 'grammar') systemPrompt = "Correct grammar, spelling, and style errors in the input text. Provide the response in English.";
            else systemPrompt = "Solve the problem step-by-step with clear explanations in English.";

            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.1-8b-instant",
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await res.json();
            
            if (res.ok && data.choices && data.choices[0]) {
                output.innerText = data.choices[0].message.content;
            } else {
                const errorMsg = data.error ? data.error.message : JSON.stringify(data);
                output.innerText = `❌ API Error: ${errorMsg}`;
            }
        } catch (err) {
            output.innerText = `❌ Connection Error: ${err.message}`;
        }
    }
</script>

</body>
</html>
